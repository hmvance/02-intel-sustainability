<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Intel timeline custom image 1978</title>
  <desc id="desc">Abstract processor diagram with teal gradients and an 8086 label.</desc>
  <defs>
    <linearGradient id="bg3" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0d3b4e"/>
      <stop offset="100%" stop-color="#17a2a6"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" fill="url(#bg3)"/>
  <g opacity="0.25" fill="none" stroke="#d9fbff" stroke-width="4">
    <path d="M70 120h760"/>
    <path d="M70 190h760"/>
    <path d="M70 260h760"/>
    <path d="M70 330h760"/>
  </g>
  <g transform="translate(180 150)">
    <rect x="0" y="0" width="540" height="220" rx="26" fill="#dffcff"/>
    <rect x="30" y="30" width="480" height="160" rx="18" fill="#133645"/>
    <g fill="#7fe3d5">
      <rect x="55" y="55" width="56" height="56" rx="12"/>
      <rect x="125" y="55" width="56" height="56" rx="12"/>
      <rect x="195" y="55" width="56" height="56" rx="12"/>
      <rect x="265" y="55" width="56" height="56" rx="12"/>
      <rect x="335" y="55" width="56" height="56" rx="12"/>
      <rect x="405" y="55" width="56" height="56" rx="12"/>
      <rect x="55" y="125" width="56" height="56" rx="12"/>
      <rect x="125" y="125" width="56" height="56" rx="12"/>
      <rect x="195" y="125" width="56" height="56" rx="12"/>
      <rect x="265" y="125" width="56" height="56" rx="12"/>
      <rect x="335" y="125" width="56" height="56" rx="12"/>
      <rect x="405" y="125" width="56" height="56" rx="12"/>
    </g>
  </g>
  <text x="90" y="470" fill="#ecfeff" font-family="Arial, Helvetica, sans-serif" font-size="110" font-weight="700">1978</text>
  <text x="560" y="470" fill="#d8fffb" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" letter-spacing="3">8086</text>
