<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc">
  <title id="title">Intel timeline custom image 1968</title>
  <desc id="desc">Abstract technology illustration with a blue and purple gradient and the year 1968.</desc>
  <defs>
    <linearGradient id="bg1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#102a43"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <linearGradient id="chip1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eaf6ff"/>
      <stop offset="100%" stop-color="#b8d9f7"/>
    </linearGradient>
  </defs>
  <rect width="900" height="540" fill="url(#bg1)"/>
  <circle cx="725" cy="145" r="120" fill="rgba(255,255,255,0.10)"/>
  <circle cx="160" cy="420" r="150" fill="rgba(255,255,255,0.06)"/>
  <g opacity="0.78">
    <path d="M90 100h600" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
    <path d="M90 200h520" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
    <path d="M90 300h600" stroke="#dbeafe" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(175 165)">
    <rect x="0" y="0" width="360" height="220" rx="28" fill="url(#chip1)"/>
    <rect x="25" y="25" width="310" height="170" rx="20" fill="#183d67" opacity="0.9"/>
    <g fill="#9bd3ff">
      <rect x="48" y="52" width="48" height="48" rx="10"/>
      <rect x="118" y="52" width="48" height="48" rx="10"/>
      <rect x="188" y="52" width="48" height="48" rx="10"/>
      <rect x="258" y="52" width="48" height="48" rx="10"/>
      <rect x="48" y="118" width="48" height="48" rx="10"/>
      <rect x="118" y="118" width="48" height="48" rx="10"/>
      <rect x="188" y="118" width="48" height="48" rx="10"/>
      <rect x="258" y="118" width="48" height="48" rx="10"/>
    </g>
  </g>
  <g>
    <text x="90" y="470" fill="#e6f4ff" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="700">1968</text>
    <text x="610" y="470" fill="#d8ebff" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="600" letter-spacing="4">INTEL</text>
  </g>
</svg>
